[tox]
envlist = py39,py310,py311,py312,py313,py314,py313-base,py313-sqlalchemy
isolated_build = True
skip_missing_interpreters = False
# tox-uv creates each environment with uv, which downloads any interpreter
# not already installed, so no environment names a path on this machine.
requires = tox-uv

[testenv]
# NOTE: the [snowpark] extra caps the connector at <5.0.0, as snowpark itself does
# Each environment installs from source, allowing Python-version-specific dependency resolution
extras = excel,snowpark,sqlalchemy
deps =
    pytest
    pytest-xdist
commands =
    pytest {posargs:-n 24 tests/}

[testenv:py313-base]
# No extras, as `pip install snowlib` installs it. The snowpark extra caps the
# connector, so this is the only environment testing the unpinned connector.
extras =

[testenv:py313-sqlalchemy]
# The sqlalchemy extra without snowpark, so the connector is uncapped: this
# resolves connector 5 and snowflake-sqlalchemy 2.0, which reads VARIANT,
# OBJECT and ARRAY back as dict and list.
extras = sqlalchemy